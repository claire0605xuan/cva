<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>西部快槍手：極限對決 🎯</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .flash-text {
            animation: flash 0.3s infinite;
        }
        .gun-cursor {
            cursor: crosshair;
        }
    </style>
</head>
<body class="bg-stone-900 text-amber-100 font-serif min-h-screen flex flex-col items-center justify-between p-4 gun-cursor select-none">

    <!-- 頂部標題與面板 -->
    <header class="w-full max-w-xl text-center py-4">
        <h1 class="text-4xl font-extrabold text-amber-500 tracking-wider mb-2">🤠 西部快槍手</h1>
        <p class="text-stone-400 text-sm">聽到「FIRE!」出現的瞬間，以最快速度開槍！</p>
        
        <div class="flex justify-between bg-stone-800 rounded-xl p-4 mt-4 border border-amber-800/50 shadow-2xl">
            <div>
                <p class="text-xs text-stone-400">目前回合</p>
                <p id="roundText" class="text-xl font-bold text-amber-400">0 / 5</p>
            </div>
            <div>
                <p class="text-xs text-stone-400">最新反應時間</p>
                <p id="lastReaction" class="text-xl font-bold text-emerald-400">-- ms</p>
            </div>
            <div>
                <p class="text-xs text-stone-400">平均反應時間</p>
                <p id="avgReaction" class="text-xl font-bold text-amber-300">-- ms</p>
            </div>
        </div>
    </header>

    <!-- 遊戲主畫布與對決區 -->
    <main id="gameBox" class="relative w-full max-w-xl h-80 bg-stone-950 rounded-2xl border-4 border-amber-900 shadow-2xl flex flex-col items-center justify-center overflow-hidden transition-colors duration-200">
        
        <!-- 中央提示文字 -->
        <div id="statusText" class="text-3xl font-bold text-amber-200/80 text-center px-4">
            點擊下方「開始對決」
        </div>

        <!-- 覆蓋層 (開始/結束) -->
        <div id="overlay" class="absolute inset-0 bg-stone-950/90 flex flex-col items-center justify-center p-6 text-center z-10">
            <h2 id="overlayTitle" class="text-3xl font-bold text-amber-400 mb-2">準備拔槍！</h2>
            <p id="overlayDesc" class="text-stone-300 text-sm mb-6 max-w-sm">注意：太早開槍將被視為「偷跑」並算作失敗！</p>
            <button id="startBtn" class="bg-amber-600 hover:bg-amber-500 text-stone-950 font-black text-lg px-8 py-3 rounded-xl shadow-lg transition transform active:scale-95">
                開始對決
            </button>
        </div>
    </main>

    <!-- 歷史紀錄列表 -->
    <section class="w-full max-w-xl bg-stone-800/60 rounded-xl p-3 border border-stone-700 my-2">
        <p class="text-xs text-stone-400 mb-1">對決紀錄：</p>
        <div id="records" class="flex gap-2 text-xs font-mono text-stone-300 overflow-x-auto py-1">
            <span class="text-stone-500">尚無紀錄</span>
        </div>
    </section>

    <!-- 頁尾 -->
    <footer class="w-full text-center py-2 text-xs text-stone-600">
        <p>Vibe Coding - 西部快槍手對決 Web App</p>
    </footer>

    <script>
        const gameBox = document.getElementById('gameBox');
        const statusText = document.getElementById('statusText');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayDesc = document.getElementById('overlayDesc');
        const startBtn = document.getElementById('startBtn');
        
        const roundText = document.getElementById('roundText');
        const lastReaction = document.getElementById('lastReaction');
        const avgReaction = document.getElementById('avgReaction');
        const recordsEl = document.getElementById('records');

        let currentRound = 0;
        const totalRounds = 5;
        let reactions = [];
        let state = 'IDLE'; // IDLE, WAITING, READY, FINISHED
        let timerId = null;
        let startTime = 0;

        // 音效（使用 Web Audio API 生成）
        function playSound(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'gun') { // 槍聲
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(10, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.15);
                } else if (type === 'foul') { // 偷跑警告聲
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(150, ctx.currentTime);
                    gain.gain.setValueAtTime(0.5, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'signal') { // 射擊訊號
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, ctx.currentTime);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.1);
                }
            } catch (e) {}
        }

        function initGame() {
            currentRound = 0;
            reactions = [];
            recordsEl.innerHTML = '';
            overlay.classList.add('hidden');
            nextRound();
        }

        function nextRound() {
            if (currentRound >= totalRounds) {
                endGame();
                return;
            }

            currentRound++;
            roundText.textContent = `${currentRound} / ${totalRounds}`;
            state = 'WAITING';
            
            gameBox.className = "relative w-full max-w-xl h-80 bg-stone-950 rounded-2xl border-4 border-amber-900 shadow-2xl flex flex-col items-center justify-center overflow-hidden transition-colors duration-200 cursor-crosshair";
            statusText.className = "text-2xl font-bold text-amber-200/80 text-center px-4";
            statusText.textContent = "屏息等待...";

            // 隨機等待 2 ~ 4.5 秒
            const waitTime = Math.random() * 2500 + 2000;
            timerId = setTimeout(() => {
                if (state === 'WAITING') {
                    triggerFire();
                }
            }, waitTime);
        }

        function triggerFire() {
            state = 'READY';
            startTime = Date.now();
            playSound('signal');
            gameBox.className = "relative w-full max-w-xl h-80 bg-red-600 rounded-2xl border-4 border-red-400 shadow-2xl flex flex-col items-center justify-center overflow-hidden transition-colors duration-100 cursor-crosshair";
            statusText.className = "text-6xl font-black text-yellow-300 tracking-widest flash-text drop-shadow-lg";
            statusText.textContent = "🔥 FIRE! 🔥";
        }

        function handleShot() {
            if (state === 'WAITING') {
                // 偷跑 (Foul)
                clearTimeout(timerId);
                playSound('foul');
                state = 'RESULT';
                gameBox.className = "relative w-full max-w-xl h-80 bg-stone-900 rounded-2xl border-4 border-red-800 shadow-2xl flex flex-col items-center justify-center overflow-hidden cursor-crosshair";
                statusText.className = "text-2xl font-bold text-red-500 text-center px-4";
                statusText.textContent = "❌ 太早開槍！偷跑違規！";
                
                addRecord('偷跑 (Foul)');
                lastReaction.textContent = "Foul";
                
                setTimeout(nextRound, 1500);

            } else if (state === 'READY') {
                // 成功射擊
                const reactionTime = Date.now() - startTime;
                playSound('gun');
                reactions.push(reactionTime);
                state = 'RESULT';

                gameBox.className = "relative w-full max-w-xl h-80 bg-emerald-950 rounded-2xl border-4 border-emerald-500 shadow-2xl flex flex-col items-center justify-center overflow-hidden cursor-crosshair";
                statusText.className = "text-4xl font-black text-emerald-400 text-center px-4";
                statusText.textContent = `${reactionTime} ms`;

                lastReaction.textContent = `${reactionTime} ms`;
                updateAvg();
                addRecord(`${reactionTime} ms`);

                setTimeout(nextRound, 1500);
            }
        }

        function updateAvg() {
            if (reactions.length === 0) return;
            const sum = reactions.reduce((a, b) => a + b, 0);
            const avg = Math.round(sum / reactions.length);
            avgReaction.textContent = `${avg} ms`;
        }

        function addRecord(text) {
            if (recordsEl.querySelector('.text-stone-500')) {
                recordsEl.innerHTML = '';
            }
            const badge = document.createElement('span');
            badge.className = "px-2 py-1 bg-stone-700 rounded text-amber-300 font-bold whitespace-nowrap";
            badge.textContent = `R${currentRound}: ${text}`;
            recordsEl.appendChild(badge);
        }

        function endGame() {
            state = 'FINISHED';
            overlay.classList.remove('hidden');

            const validReactions = reactions.filter(r => typeof r === 'number');
            if (validReactions.length === 0) {
                overlayTitle.textContent = "💀 槍法欠佳";
                overlayDesc.textContent = "你太過急躁全部偷跑了！重新冷靜一下再試一次吧。";
            } else {
                const avg = Math.round(validReactions.reduce((a, b) => a + b, 0) / validReactions.length);
                let rank = "🤠 普通牛仔";
                if
